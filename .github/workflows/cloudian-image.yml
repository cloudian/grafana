name: Cloudian Grafana image

# Builds the Cloudian Grafana image that HyperIQ and LogInsight build FROM and, when asked, pushes it
# to quay.io/cloudian/grafana. It replaces the Jenkins job "Grafana" running cloudian_build.sh (which
# this does not touch: Jenkins still uses it until it is switched off).
#
# Run it from the Actions tab on the default branch, naming the branch to build:
# cloudian_custom_<version> (HyperIQ) or cloudian_custom_<version>_loginsight (LogInsight). The image
# tag comes from the branch name: <version> or <version>-loginsight. Nothing is pushed unless "push"
# is ticked, and a tag that already exists on quay.io is never replaced unless "overwrite" is ticked too.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build: cloudian_custom_<version> or cloudian_custom_<version>_loginsight"
        required: true
        default: cloudian_custom_12.4.1
      push:
        description: "Push the image to quay.io (unticked: build only)"
        type: boolean
        default: false
      tag_suffix:
        description: "Added to the image tag, eg -gha-test, so a trial push cannot touch the real tag"
        default: ""
      overwrite:
        description: "Replace the tag if it already exists on quay.io"
        type: boolean
        default: false
  # A build-only check of this workflow itself
  pull_request:
    paths:
      - .github/workflows/cloudian-image.yml

env:
  REPO: quay.io/cloudian/grafana

permissions:
  contents: read

# A pull request check can be cancelled by a newer push; a build that may be pushing is left to finish
concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

jobs:
  image:
    name: Build image
    # GitHub-hosted, not our self-hosted runners: this is a public repository, and self-hosted
    # runners must not run code from a public repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:

      # The tag is the Grafana version the branch is for, not git describe: that is the tag
      # HyperIQ and LogInsight build FROM, and it is replaced when the image is rebuilt
      - name: Work out the image tag
        id: tag
        env:
          EVENT: ${{github.event_name}}
          BRANCH: ${{inputs.branch}}
          PUSH: ${{inputs.push}}
          SUFFIX: ${{inputs.tag_suffix}}
          PR_NUMBER: ${{github.event.number}}
        run: |
          set -euo pipefail
          push=false
          if [ "$EVENT" = workflow_dispatch ]; then
            re='^cloudian_custom_([0-9]+\.[0-9]+\.[0-9]+)(_loginsight)?$'
            [[ "$BRANCH" =~ $re ]] || { echo "::error::'$BRANCH' is not cloudian_custom_<version> or cloudian_custom_<version>_loginsight"; exit 1; }
            tag="${BASH_REMATCH[1]}"
            if [ -n "${BASH_REMATCH[2]}" ]; then tag="$tag-loginsight"; fi
            [[ "$SUFFIX" =~ ^[A-Za-z0-9._-]*$ ]] || { echo "::error::The tag suffix may only have letters, digits, dots, dashes and underscores"; exit 1; }
            tag="$tag$SUFFIX"
            push="$PUSH"
          else
            tag="pr-$PR_NUMBER"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "Image $REPO:$tag, push: $push" | tee -a "$GITHUB_STEP_SUMMARY"

      # Before the (long) build, so a mistake is seen straight away. Quay's tag list is public; curl -f
      # fails the step if it can't be read, so a push is never allowed on a guess
      - name: Check the tag is not already on quay.io
        if: steps.tag.outputs.push == 'true' && inputs.overwrite != true
        env:
          TAG: ${{steps.tag.outputs.tag}}
        run: |
          set -euo pipefail
          found=$(curl -fsS --retry 3 "https://quay.io/api/v1/repository/cloudian/grafana/tag/?onlyActiveTags=true&specificTag=$TAG" \
            | python3 -c 'import json, sys; print(len(json.load(sys.stdin)["tags"]))')
          if [ "$found" != 0 ]; then
            echo "::error::$REPO:$TAG already exists on quay.io; tick overwrite to replace it, or use a tag suffix"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{github.event_name == 'workflow_dispatch' && inputs.branch || ''}}
          persist-credentials: false

      - name: Build the image
        env:
          TAG: ${{steps.tag.outputs.tag}}
        run: make build-docker-full-cloudian

      - name: Log in to quay.io
        if: steps.tag.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{secrets.QUAY_ROBOT_USER}}
          password: ${{secrets.QUAY_ROBOT_PASSWORD}}

      - name: Push the image
        if: steps.tag.outputs.push == 'true'
        env:
          TAG: ${{steps.tag.outputs.tag}}
        run: |
          docker push "$REPO:$TAG"
          echo "Pushed $(docker image inspect --format '{{index .RepoDigests 0}}' "$REPO:$TAG")" | tee -a "$GITHUB_STEP_SUMMARY"

      # Leave nothing behind, in case the credentials or image are looked for
      - name: Clean up
        if: always()
        env:
          TAG: ${{steps.tag.outputs.tag}}
        run: |
          docker logout quay.io || true
          if [ -n "$TAG" ]; then docker image rm "$REPO:$TAG" || true; fi
